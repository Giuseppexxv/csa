<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Aggregator & Reader</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>🎬 Media Aggregator & Reader</h1>
            <nav class="main-nav">
                <button class="nav-btn active" data-tab="catalog">Catalogo</button>
                <button class="nav-btn" data-tab="sources">Gestione Sorgenti</button>
                <button class="nav-btn" data-tab="search">Ricerca Contenuti</button>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Tab Catalogo TMDB -->
            <section id="catalog-tab" class="tab-content active">
                <div class="search-bar">
                    <input type="text" id="tmdb-search-input" placeholder="Cerca film o serie TV..." />
                    <input type="number" id="tmdb-year-input" placeholder="Anno (opzionale)" min="1900" max="2030" />
                    <button id="tmdb-search-btn">Cerca</button>
                </div>
                
                <div id="catalog-results" class="results-grid">
                    <!-- I risultati TMDB verranno inseriti qui -->
                </div>
            </section>

            <!-- Tab Gestione Sorgenti -->
            <section id="sources-tab" class="tab-content">
                <div class="source-manager">
                    <div class="source-form">
                        <h2>Aggiungi Nuova Sorgente</h2>
                        <form id="add-source-form">
                            <input type="text" id="source-name" placeholder="Nome sorgente" required />
                            <input type="url" id="source-url" placeholder="URL base (es. https://example.com)" required />
                            <button type="submit">Aggiungi Sorgente</button>
                        </form>
                        
                        <div class="import-section">
                            <h3>Importa da File TXT</h3>
                            <textarea id="import-urls" placeholder="Incolla qui gli URL (uno per riga)"></textarea>
                            <button id="import-btn">Importa URL</button>
                        </div>
                    </div>
                    
                    <div class="sources-list">
                        <h2>Sorgenti Configurate</h2>
                        <div id="sources-container">
                            <!-- La lista delle sorgenti verrà inserita qui -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Tab Ricerca Contenuti -->
            <section id="search-tab" class="tab-content">
                <div class="content-search">
                    <h2>Cerca su Tutte le Sorgenti</h2>
                    <input type="text" id="content-search-input" placeholder="Titolo da cercare sulle sorgenti..." />
                    <button id="content-search-btn">Cerca</button>
                    
                    <div id="content-results" class="results-list">
                        <!-- I risultati della ricerca contenuti verranno inseriti qui -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Modal Dettagli -->
        <div id="details-modal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <div id="modal-body">
                    <!-- I dettagli del contenuto verranno inseriti qui -->
                </div>
            </div>
        </div>

        <!-- Player Video -->
        <div id="player-modal" class="modal">
            <div class="modal-content player-modal-content">
                <span class="modal-close">&times;</span>
                <div id="player-container">
                    <video id="video-player" controls></video>
                </div>
                <div id="stream-info">
                    <!-- Informazioni sullo stream -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/js/app.js"></script>
</body>
</html>
